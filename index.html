<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小西家 - わんこファミリーアプリ</title>
    <link rel="apple-touch-icon" href="1792306567992.jpg">
    <link rel="icon" href="1792306567992.jpg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fdfbf7;
            color: #4a3b32;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 12px;
        }
        .container {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 2px solid #f3e5d8;
        }
        .dog-icon-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #d97706;
            margin-bottom: 12px;
        }
        h1 { font-size: 24px; font-weight: 700; color: #8b5a2b; text-align: center; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #8c7355; margin-bottom: 20px; text-align: center; }
        .btn {
            background-color: #d97706;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
        .hidden { display: none !important; }
        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fef3c7;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 14px;
        }
        .user-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .widget-card {
            background: #fafaf9;
            border: 1px solid #e7e5e4;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .input-field {
            padding: 10px;
            border: 1px solid #d6d3d1;
            border-radius: 8px;
            width: 100%;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="login-section" style="margin: auto; text-align: center; display: flex; flex-direction: column; align-items: center; padding: 20px;">
            <img src="1792306567992.jpg" class="dog-icon-large" alt="小西家わんこ" onerror="this.style.display='none'">
            <h1>🐾 小西家 🐾</h1>
            <p class="subtitle">わんことうるおう、家族の共有アプリ</p>
            <button class="btn" id="login-btn">🐶 Googleでログイン</button>
        </div>

        <div id="user-section" class="hidden" style="display: flex; flex-direction: column; flex: 1;">
            <div class="user-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img id="user-photo" class="user-photo" alt="アイコン">
                    <div style="font-weight: bold; font-size: 14px; color: #78350f;"><span id="user-name"></span> さん</div>
                </div>
            </div>
            <div class="widget-card">
                <div style="font-weight: bold; color: #78350f; margin-bottom: 8px;">➕ 予定を追加</div>
                <input type="date" id="event-date" class="input-field">
                <input type="text" id="event-title" class="input-field" placeholder="予定の内容">
                <button class="btn" id="add-schedule-btn">予定を追加する</button>
            </div>
            <div class="widget-card" style="flex: 1;">
                <div style="font-weight: bold; color: #78350f; margin-bottom: 8px;">📅 予定一覧</div>
                <div id="schedule-container" style="font-size: 13px; color: #8c7355;">読み込み中...</div>
            </div>
            <button class="btn" id="logout-btn" style="background-color: #9ca3af; margin-top: 10px;">ログアウト</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuR7NVKyrWu6MMegnhJI3qTr4ceiPngfE",
            authDomain: "konishi-family.firebaseapp.com",
            projectId: "konishi-family",
            storageBucket: "konishi-family.appspot.com",
            messagingSenderId: "391240149978",
            appId: "1:391240149978:web:c65a95e99c043d9d0d6ee3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        document.getElementById("login-btn").addEventListener("click", () => {
            signInWithPopup(auth, provider).catch((error) => alert("エラー: " + error.message));
        });
        document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("login-section").classList.add("hidden");
                document.getElementById("user-section").classList.remove("hidden");
                document.getElementById("user-name").textContent = user.displayName || "ユーザー";
                if (user.photoURL) document.getElementById("user-photo").src = user.photoURL;

                const q = query(collection(db, "schedules"), orderBy("date", "asc"));
                onSnapshot(q, (snapshot) => {
                    const c = document.getElementById("schedule-container");
                    c.innerHTML = snapshot.empty ? '予定はありません' : '';
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        c.innerHTML += `<div style="background:white; padding:8px; margin-bottom:6px; border-radius:6px; border-left:3px solid #d97706;"><b>${d.date}</b>: ${d.title}</div>`;
                    });
                });
            } else {
                document.getElementById("login-section").classList.remove("hidden");
                document.getElementById("user-section").classList.add("hidden");
            }
        });

        document.getElementById("add-schedule-btn").addEventListener("click", async () => {
            const date = document.getElementById('event-date').value;
            const title = document.getElementById('event-title').value;
            if (!date || !title) return alert('日付と内容を入力してください');
            try {
                await addDoc(collection(db, "schedules"), { date, title, createdAt: new Date() });
                document.getElementById('event-date').value = '';
                document.getElementById('event-title').value = '';
            } catch (e) { alert("保存失敗: " + e.message); }
        });
    </script>
</body>
</html>
