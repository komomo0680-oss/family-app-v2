<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小西家</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f7f5;
      color: #333333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 { font-size: 28px; margin-bottom: 12px; font-weight: 700; letter-spacing: 2px; }
    p { color: #666666; font-size: 15px; margin-bottom: 24px; }
    .btn {
      background-color: #1a62a6;
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-logout { background-color: #d9534f; margin-top: 15px; }
    .hidden { display: none; }
    .user-info { margin-bottom: 20px; }
    .user-icon { width: 64px; height: 64px; border-radius: 50%; margin-bottom: 10px; }
  </style>
</head>
<body>

  <main class="container">
    <h1>小西家</h1>

    <!-- 未ログイン時 -->
    <div id="login-section">
      <p>ファミリーアプリへようこそ</p>
      <button class="btn" id="login-btn">Googleでログイン</button>
    </div>

    <!-- ログイン完了時 -->
    <div id="user-section" class="hidden">
      <div class="user-info">
        <img id="user-photo" class="user-icon" src="" alt="ユーザーアイコン">
        <p>ようこそ、<strong id="user-name"></strong> さん！</p>
      </div>
      <p>小西家の専用ページへアクセスしました。</p>
      <button class="btn btn-logout" id="logout-btn">ログアウト</button>
    </div>
  </main>

  <!-- Firebase Auth SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDuR7NVkyrWu6MmegnHJI3Tr4ceiPngfE",
      authDomain: "konishi-family.firebaseapp.com",
      projectId: "konishi-family",
      storageBucket: "konishi-family.firebasestorage.app",
      messagingSenderId: "391240149978",
      appId: "1:391240149978:web:34e6b1e63f7752030d6ee3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginSection = document.getElementById("login-section");
    const userSection = document.getElementById("user-section");
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userName = document.getElementById("user-name");
    const userPhoto = document.getElementById("user-photo");

    // リダイレクト結果の受け取り処理
    getRedirectResult(auth).catch((error) => {
      if (error.code) {
        alert("ログインエラー (" + error.code + "): " + error.message);
      }
    });

    // ログイン実行（画面遷移方式に変更）
    loginBtn.addEventListener("click", () => {
      signInWithRedirect(auth, provider);
    });

    // ログアウト実行
    logoutBtn.addEventListener("click", () => {
      signOut(auth);
    });

    // ログイン状態の監視
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userName.textContent = user.displayName;
        userPhoto.src = user.photoURL || "https://via.placeholder.com/64";
        loginSection.classList.add("hidden");
        userSection.classList.remove("hidden");
      } else {
        loginSection.classList.remove("hidden");
        userSection.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
