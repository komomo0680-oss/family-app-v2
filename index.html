<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小西家 - わんこファミリーアプリ</title>
    
    <!-- スマホホーム画面用アイコン (PWA / Web App) -->
    <link rel="apple-touch-icon" href="1792306567992.jpg">
    <link rel="icon" href="1792306567992.jpg">
    
    <!-- スマホ・PWA用フルスクリーン設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="小西家">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fdfbf7;
            color: #4a3b32;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 40px;
        }
        .container {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(139, 90, 43, 0.06);
            width: 100%;
            max-width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 2px solid #f3e5d8;
        }
        .dog-icon-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #d97706;
            box-shadow: 0 6px 16px rgba(217, 119, 6, 0.2);
            margin-bottom: 12px;
        }
        h1 { font-size: 24px; font-weight: 700; color: #8b5a2b; text-align: center; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #8c7355; margin-bottom: 20px; text-align: center; }
        
        .btn {
            background-color: #d97706;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.2);
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-logout { background-color: #9ca3af; margin-top: 20px; }

        .hidden { display: none !important; }
        
        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fef3c7;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 14px;
        }
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .user-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #d97706; }
        .user-name { font-weight: bold; font-size: 14px; color: #78350f; }

        .tab-nav {
            display: flex;
            gap: 6px;
            background: #f3e5d8;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 14px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 4px;
            font-size: 13px;
            font-weight: bold;
            color: #8c7355;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #d97706;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            gap: 12px;
        }
        .tab-content.active { display: flex; }

        .widget-card {
            background: #fafaf9;
            border: 1px solid #e7e5e4;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .widget-title {
            font-size: 14px;
            font-weight: bold;
            color: #78350f;
            margin-bottom: 10px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-field {
            padding: 10px;
            border: 1px solid #d6d3d1;
            border-radius: 8px;
            font-size: 13px;
            width: 100%;
        }
        textarea.input-field {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .item-card {
            background: #ffffff;
            border: 1px solid #f3e5d8;
            border-left: 4px solid #d97706;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
