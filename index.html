<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小西家 - わんこファミリーアプリ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fdfbf7;
            color: #4a3b32;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 12px;
        }
        /* 画面いっぱいに広げるコンテナ */
        .container {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(139, 90, 43, 0.06);
            width: 100%;
            max-width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 2px solid #f3e5d8;
        }
        h1 { font-size: 22px; margin-bottom: 4px; font-weight: 700; color: #8b5a2b; text-align: center; }
        .subtitle { font-size: 13px; color: #8c7355; margin-bottom: 16px; text-align: center; }
        
        /* ボタン */
        .btn {
            background-color: #d97706;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.2);
        }
        .btn:hover { background-color: #b45309; }
        .btn-logout { background-color: #9ca3af; margin-top: auto; }

        .hidden { display: none !important; }
        
        /* ユーザー情報ヘッダー */
        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fef3c7;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 14px;
        }
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .user-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #d97706; }
        .user-name { font-weight: bold; font-size: 14px; color: #78350f; }

        /* タブナビゲーション */
        .tab-nav {
            display: flex;
            gap: 4px;
            background: #f3e5d8;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 14px;
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 2px;
            font-size: 11px;
            font-weight: bold;
            color: #8c7355;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #d97706;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* タブの中身エリア（ウィジェット風カード） */
        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            gap: 10px;
        }
        .tab-content.active { display: flex; }

        .widget-card {
            background: #fafaf9;
            border: 1px solid #e7e5e4;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .widget-title {
            font-size: 14px;
            font-weight: bold;
            color: #78350f;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .widget-body {
            font-size: 13px;
            color: #57534e;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ログイン前画面 -->
        <div id="login-section" style="margin: auto; text-align: max(0px, 20px);">
            <h1>🐾 小西家 🐾</h1>
            <p class="subtitle">わんことうるおう、家族の共有アプリ</p>
            <button class="btn" id="login-btn">🐶 Googleでログイン</button>
        </div>

        <!-- ログイン後画面（メインアプリ） -->
        <div id="user-section" class="hidden" style="display: flex; flex-direction: column; flex: 1;">
            <div class="user-header">
                <div class="user-profile">
                    <img id="user-photo" class="user-photo" alt="アイコン">
                    <div class="user-name"><span id="user-name"></span> さん</div>
                </div>
                <span style="font-size: 18px;">🐶🐾</span>
            </div>

            <!-- タブ切り替えボタン -->
            <div class="tab-nav">
                <button class="tab-btn active" onclick="switchTab('schedule')">予定</button>
                <button class="tab-btn" onclick="switchTab('todo')">TODO</button>
                <button class="tab-btn" onclick="switchTab('goals')">目標</button>
                <button class="tab-btn" onclick="switchTab('contact')">連絡事項</button>
                <button class="tab-btn" onclick="switchTab('memo')">思考整理</button>
            </div>

            <!-- 1. 予定タブ -->
            <div id="schedule" class="tab-content active">
                <div class="widget-card">
                    <div class="widget-title">📅 家族の予定（カレンダー連携）</div>
                    <div class="widget-body">Googleカレンダーから「日付・予定・誰の予定か」をここにリスト表示します。</div>
                </div>
            </div>

            <!-- 2. TODOタブ -->
            <div id="todo" class="tab-content">
                <div class="widget-card">
                    <div class="widget-title">📝 TODOリスト</div>
                    <div class="widget-body">「共有する」ボタン付きのタスク管理ウィジェットをここに配置します。</div>
                </div>
            </div>

            <!-- 3. 目標タブ -->
            <div id="goals" class="tab-content">
                <div class="widget-card">
                    <div class="widget-title">🎯 長期・短期目標（自分のみ）</div>
                    <div class="widget-body">自分だけが見られる非公開の目標管理ウィジェットです。</div>
                </div>
            </div>

            <!-- 4. 連絡事項タブ -->
            <div id="contact" class="tab-content">
                <div class="widget-card">
                    <div class="widget-title">💬 家族の連絡掲示板</div>
                    <div class="widget-body">誰からの連絡かアイコン付きでわかるメッセージボードです。</div>
                </div>
            </div>

            <!-- 5. 思考整理タブ -->
            <div id="memo" class="tab-content">
                <div class="widget-card">
                    <div class="widget-title">🌳 思考の階層整理ツリー</div>
                    <div class="widget-body">上位層と下位層を階層的に整理できるメモウィジェットです。</div>
                </div>
            </div>

            <button class="btn btn-logout" id="logout-btn" style="margin-top: 15px;">ログアウト</button>
        </div>
    </div>

    <!-- Firebase SDK & アプリのロジック -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuR7NVKyrWu6MMegnhJI3qTr4ceiPngfE",
            authDomain: "konishi-family.firebaseapp.com",
            projectId: "konishi-family",
            storageBucket: "konishi-family.appspot.com",
            messagingSenderId: "391240149978",
            appId: "1:391240149978:web:c65a95e99c043d9d0d6ee3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginSection = document.getElementById("login-section");
        const userSection = document.getElementById("user-section");
        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const userName = document.getElementById("user-name");
        const userPhoto = document.getElementById("user-photo");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add("hidden");
                userSection.classList.remove("hidden");
                userName.textContent = user.displayName || "ユーザー";
                if (user.photoURL) {
                    userPhoto.src = user.photoURL;
                }
            } else {
                loginSection.classList.remove("hidden");
                userSection.classList.add("hidden");
            }
        });

        loginBtn.addEventListener("click", () => {
            signInWithPopup(auth, provider).catch((error) => {
                alert("ログインエラー (" + error.code + "): " + error.message);
            });
        });

        logoutBtn.addEventListener("click", () => {
            signOut(auth);
        });
    </script>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
