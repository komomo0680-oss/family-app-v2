<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小西家</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f7f7;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 28px; margin-bottom: 12px; font-weight: 700; letter-spacing: 2px; }
        p { color: #666666; font-size: 15px; margin-bottom: 25px; }
        .btn {
            background-color: #1a73e8;
            color: #ffffff;
            border: none;
            padding: 15px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #1557b0; }
        .btn-logout { background-color: #dc3545; margin-top: 15px; }
        .btn-logout:hover { background-color: #bb2d3b; }
        .hidden { display: none !important; }
        .user-info { margin-bottom: 20px; }
        .user-photo { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 15px; object-fit: cover; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ログイン前画面 -->
        <div id="login-section">
            <h1>小西家</h1>
            <p>ファミリーアプリへようこそ</p>
            <button class="btn" id="login-btn">Googleでログイン</button>
        </div>

        <!-- ログイン後画面 -->
        <div id="user-section" class="hidden">
            <img id="user-photo" class="user-photo" alt="ユーザーアイコン">
            <p><strong id="user-name"></strong> さん、こんにちは！</p>
            <p>ログインに成功しました。</p>
            <button class="btn btn-logout" id="logout-btn">ログアウト</button>
        </div>
    </div>

    <!-- Firebase SDK (インポート) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuR7NVKyrWu6MMegnhJI3qTr4ceiPngfE",
            authDomain: "konishi-family.firebaseapp.com",
            projectId: "konishi-family",
            storageBucket: "konishi-family.appspot.com",
            messagingSenderId: "391240149978",
            appId: "1:391240149978:web:c65a95e99c043d9d0d6ee3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginSection = document.getElementById("login-section");
        const userSection = document.getElementById("user-section");
        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const userName = document.getElementById("user-name");
        const userPhoto = document.getElementById("user-photo");

        // 1. ログイン状態の監視（自動で画面を切り替える）
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ログイン中の表示
                loginSection.classList.add("hidden");
                userSection.classList.remove("hidden");
                userName.textContent = user.displayName || "ユーザー";
                if (user.photoURL) {
                    userPhoto.src = user.photoURL;
                }
            } else {
                // 未ログインの表示
                loginSection.classList.remove("hidden");
                userSection.classList.add("hidden");
            }
        });

        // 2. リダイレクト結果の受け取り
        getRedirectResult(auth).catch((error) => {
            if (error && error.code) {
                alert("ログインエラー (" + error.code + "): " + error.message);
            }
        });

        // 3. ボタンのイベント設定
        loginBtn.addEventListener("click", () => {
            signInWithRedirect(auth, provider);
        });

        logoutBtn.addEventListener("click", () => {
            signOut(auth);
        });
    </script>
</body>
</html>
