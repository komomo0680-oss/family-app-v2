<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>小西家</title>
  <style>
    :root {
      --bg: #f7f6f2;
      --card: #ffffff;
      --tx: #1f1e1b;
      --tx2: #6b6a64;
      --bd: #e2e0d8;
      --ac: #185FA5;
      --acbg: #E6F1FB;
      --dg: #A32D2D;
      --wnbg: #FAEEDA;
      --wn: #633806;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1c1b19;
        --card: #262522;
        --tx: #f1efe8;
        --tx2: #b4b2a9;
        --bd: #3a3935;
        --ac: #85B7EB;
        --acbg: #0C447C;
        --dg: #F09595;
        --wnbg: #633806;
        --wn: #FAC775;
      }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header {
      text-align: center;
      padding: 16px 0;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      color: var(--tx);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--ac);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">小西家</h1>
    </div>
    <div class="card">
      <p style="text-align:center; margin-top:0;">ファミリーアプリへようこそ</p>
      <button class="btn" onclick="alert('Googleログインを準備中です')">
        Googleでログイン
      </button>
    </div>
  </div>
</body>
</html>
