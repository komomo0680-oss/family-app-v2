<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小西家 - わんこファミリーアプリ</title>
    
    <!-- スマホホーム画面用アイコン (PWA / Web App) -->
    <link rel="apple-touch-icon" href="1792306567992.jpg">
    <link rel="icon" href="1792306567992.jpg">
    
    <!-- スマホ・PWA用フルスクリーン設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="小西家">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fdfbf7;
            color: #4a3b32;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 40px; /* スマホの下部バーと重ならないように余白を追加 */
        }
        .container {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(139, 90, 43, 0.06);
            width: 100%;
            max-width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 2px solid #f3e5d8;
        }
        .dog-icon-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #d97706;
            box-shadow: 0 6px 16px rgba(217, 119, 6, 0.2);
            margin-bottom: 12px;
        }
        h1 { font-size: 24px; font-weight: 700; color: #8b5a2b; text-align: center; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #8c7355; margin-bottom: 20px; text-align: center; }
        
        .btn {
            background-color: #d97706;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.2);
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-logout { background-color: #9ca3af; margin-top: 20px; margin-bottom: 20px; }

        .hidden { display: none !important; }
        
        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fef3c7;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 14px;
        }
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .user-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #d97706; }
        .user-name { font-weight: bold; font-size: 14px; color: #78350f; }

        .tab-nav {
            display: flex;
            gap: 4px;
            background: #f3e5d8;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 14px;
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 2px;
            font-size: 11px;
            font-weight: bold;
            color: #8c7355;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #d97706;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            gap: 12px;
        }
        .tab-content.active { display: flex; }

        .widget-card {
            background: #fafaf9;
            border: 1px solid #e7e5e4;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .widget-title {
            font-size: 14px;
            font-weight: bold;
            color: #78350f;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }
        .input-field {
            padding: 10px;
            border: 1px solid #d6d3d1;
            border-radius: 8px;
            font-size: 13px;
            width: 100%;
        }
        
        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .schedule-item {
            background: #ffffff;
            border: 1px solid #f3e5d8;
            border-left: 4px solid #d97706;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .schedule-date { font-size: 11px; color: #8c7355; font-weight: bold; }
        .schedule-text { font-size: 13px; color: #4a3b32; font-weight: bold; }
        .schedule-owner {
            font-size: 11px;
            background: #fef3c7;
            color: #78350f;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ログイン前画面 -->
        <div id="login-section" style="margin: auto; text-align: center; display: flex; flex-direction: column; align-items: center; padding: 20px;">
            <img src="1792306567992.jpg" class="dog-icon-large" alt="小西家わんこ" onerror="this.style.display='none'">
            <h1>🐾 小西家 🐾</h1>
            <p class="subtitle">わんことうるおう、家族の共有アプリ</p>
            <button class="btn" id="login-btn">🐶 Googleでログイン</button>
        </div>

        <!-- ログイン後画面（メインアプリ） -->
        <div id="user-section" class="hidden" style="display: flex; flex-direction: column; flex: 1;">
            <div class="user-header">
                <div class="user-profile">
                    <img id="user-photo" class="user-photo" alt="アイコン">
                    <div class="user-name"><span id="user-name"></span> さん</div>
                </div>
                <img src="1792306567992.jpg" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #d97706;" alt="小西家わんこ" onerror="this.style.display='none'">
            </div>

            <!-- タブ切り替えボタン -->
            <div class="tab-nav">
                <button class="tab-btn active" onclick="switchTab('schedule')">予定</button>
                <button class="tab-btn" onclick="switchTab('todo')">TODO</button>
                <button class="tab-btn" onclick="switchTab('goals')">目標</button>
                <button class="tab-btn" onclick="switchTab('contact')">連絡事項</button>
                <button class="tab-btn" onclick="switchTab('memo')">思考整理</button>
            </div>

            <!-- 1. 予定タブ -->
            <div id="schedule" class="tab-content active">
                <div class="widget-card">
                    <div class="widget-title">➕ 予定を追加（自動共有）</div>
                    <div class="input-group">
                        <input type="date" id="event-date" class="input-field">
                        <input type="text" id="event-title" class="input-field" placeholder="予定の内容 (例: 買い物、病院)">
                        <input type="text" id="event-owner" class="input-field" placeholder="誰の予定か (例: 小西家、仕事アプリ)">
                        <button class="btn" id="add-schedule-btn">予定を追加する</button>
                    </div>
                </div>

                <div class="widget-card">
                    <div class="widget-title">📅 家族・連携アプリの共通予定</div>
                    <div id="schedule-container" class="schedule-list">
                        <div style="font-size: 12px; color: #8c7355;">読み込み中...</div>
                    </div>
                </div>
            </div>

            <!-- 2. TODOタブ -->
            <div id="todo" class="tab-content">
                <div class="widget-card">
                    <div class="widget-title">📝 TODOリスト</div>
                    <div class="widget-body">タスク管理ウィジェット</div>
                </div>
            </div>

            <!-- 3. 目標タブ -->
            <div id="goals" class="tab-content">
                <div class="widget-card">
                    <div class="widget-title">🎯 長期・短期目標（自分のみ）</div>
                    <div class="widget-body">目標管理ウィジェット</div>
                </div>
            </div>

            <!-- 4. 連絡事項タブ -->
            <div id="contact" class="tab-content">
                <div class="widget-card">
                    <div class="widget-title">💬 家族の連絡掲示板</div>
                    <div class="widget-body">メッセージボード</div>
                </div>
            </div>

            <!-- 5. 思考整理タブ -->
            <div id="memo" class="tab-content">
                <div class="widget-card">
                    <div class="widget-title">🌳 思考の階層整理ツリー</div>
                    <div class="widget-body">思考整理メモウィジェット</div>
                </div>
            </div>

            <button class="btn btn-logout" id="logout-btn">ログアウト</button>
        </div>
    </div>

    <!-- Firebase SDK (Auth & Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuR7NVKyrWu6MMegnhJI3qTr4ceiPngfE",
            authDomain: "konishi-family.firebaseapp.com",
            projectId: "konishi-family",
            storageBucket: "konishi-family.appspot.com",
            messagingSenderId: "391240149978",
            appId: "1:391240149978:web:c65a95e99c043d9d0d6ee3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let db = null;
        const provider = new GoogleAuthProvider();

        const loginSection = document.getElementById("login-section");
        const userSection = document.getElementById("user-section");
        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const userName = document.getElementById("user-name");
        const userPhoto = document.getElementById("user-photo");
        const addScheduleBtn = document.getElementById("add-schedule-btn");
        const scheduleContainer = document.getElementById("schedule-container");

        loginBtn.addEventListener("click", () => {
            signInWithPopup(auth, provider).catch((error) => {
                alert("ログインエラー: " + error.message);
            });
        });

        logoutBtn.addEventListener("click", () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add("hidden");
                userSection.classList.remove("hidden");
                userName.textContent = user.displayName || "ユーザー";
                if (user.photoURL) userPhoto.src = user.photoURL;

                if (!document.getElementById("event-owner").value) {
                    document.getElementById("event-owner").value = user.displayName || "小西家";
                }

                try {
                    db = getFirestore(app);
                    listenToSchedules();
                } catch (e) {
                    console.error("Firestore初期化エラー:", e);
                }
            } else {
                loginSection.classList.remove("hidden");
                userSection.classList.add("hidden");
            }
        });

        addScheduleBtn.addEventListener("click", async () => {
            const date = document.getElementById('event-date').value;
            const title = document.getElementById('event-title').value;
            const owner = document.getElementById('event-owner').value;

            if (!date || !title) {
                alert('日付と予定内容を入力してください');
                return;
            }

            if (!db) {
                alert("データベースが準備できていません");
                return;
            }

            try {
                await addDoc(collection(db, "schedules"), {
                    date: date,
                    title: title,
                    owner: owner || "小西家",
                    createdAt: new Date()
                });
                document.getElementById('event-date').value = '';
                document.getElementById('event-title').value = '';
            } catch (e) {
                alert("予定の保存に失敗しました: " + e.message);
            }
        });

        function listenToSchedules() {
            if (!db) return;
            const q = query(collection(db, "schedules"), orderBy("date", "asc"));
            onSnapshot(q, (snapshot) => {
                scheduleContainer.innerHTML = '';
                if (snapshot.empty) {
                    scheduleContainer.innerHTML = '<div style="font-size: 12px; color: #8c7355;">予定はありません</div>';
                    return;
                }
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const el = document.createElement('div');
                    el.className = 'schedule-item';
                    el.innerHTML = `
                        <div>
                            <div class="schedule-date">${data.date}</div>
                            <div class="schedule-text">${data.title}</div>
                        </div>
                        <div class="schedule-owner">${data.owner}</div>
                    `;
                    scheduleContainer.appendChild(el);
                });
            }, (error) => {
                console.error("Firestore読み込みエラー:", error);
                scheduleContainer.innerHTML = '<div style="font-size: 12px; color: #8c7355;">予定の読み込みに失敗しました</div>';
            });
        }
    </script>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
